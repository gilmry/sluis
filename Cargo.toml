[package]
name = "sluis"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "L'écluse : orchestrateur d'infrastructure OVH exposé comme serveur MCP"
repository = "https://github.com/gilmry/sluis"
authors = ["Gilles Maury <gilmry@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
thiserror = "2"
toml = "0.9"


[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[[bin]]
name = "sluis-mcp"
path = "src/bin/sluis_mcp.rs"

[[bin]]
name = "sluis"
path = "src/bin/sluis.rs"
