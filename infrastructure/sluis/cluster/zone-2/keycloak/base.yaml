# Base du Keycloak, une instance, sur le volume chiffré du nœud. WAL archivés
# en continu vers le compartiment de la zone 2 à Paris ; sauvegarde de base
# chaque nuit. Rétention 30 jours, égale au verrou du compartiment.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: paris
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://${compartiment_wal_zone_2}/keycloak-db
    endpointURL: ${s3_endpoint}
    s3Credentials:
      accessKeyId:
        name: s3-wal
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-wal
        key: ACCESS_SECRET_KEY
      region:
        name: s3-wal
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie@sha256:2a2fe731f3b421d1a1c1f84e70e95ef0658bf198b6c8dbbfe53d51f24c3275b8
  storage:
    size: 2Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paris
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-nuit
spec:
  schedule: "0 20 2 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: keycloak-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
