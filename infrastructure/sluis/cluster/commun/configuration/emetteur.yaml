# Certificats par le défi HTTP : aucun jeton DNS ne vit dans le cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${acme_courriel}
    privateKeySecretRef:
      name: letsencrypt-compte
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
