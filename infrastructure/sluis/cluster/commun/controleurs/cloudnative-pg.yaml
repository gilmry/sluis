apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cnpg-system
  releaseName: cnpg
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
---
# Archivage des WAL et sauvegardes de base vers le stockage objet (ADR-026),
# par le greffon barman-cloud. Son certificat vient de cert-manager.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: cloudnative-pg
  interval: 1h
  targetNamespace: cnpg-system
  releaseName: barman-cloud
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
