# Keycloak des SaaS (zone 1) : les comptes des clients, jamais ceux des
# administrateurs de la plateforme (ADR-042, ADR-043).
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 1
  image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  # TLS terminé par Traefik ; dans le cluster, HTTP derrière les
  # NetworkPolicy.
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  hostname:
    hostname: https://${keycloak_saas_domaine}
    strict: true
  ingress:
    enabled: false
  resources:
    requests:
      memory: 1280Mi
    limits:
      memory: 1280Mi
