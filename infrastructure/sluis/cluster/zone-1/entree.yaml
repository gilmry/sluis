# Seuls /realms et /resources sortent : la console d'administration et
# /metrics ne sont jamais publiés. HTTPS seulement.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${keycloak_saas_domaine}
      secretName: keycloak-tls
  rules:
    - host: ${keycloak_saas_domaine}
      http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
