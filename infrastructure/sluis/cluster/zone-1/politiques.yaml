# Rien n'entre dans l'espace sans y être admis ici. La sortie reste ouverte :
# les sauvegardes vont à Paris, les images viennent des registres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-par-defaut
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meme-espace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
# L'opérateur CloudNativePG interroge l'état de chaque instance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operateur-cnpg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
---
# Traefik (kube-system) n'atteint que Keycloak, et que son port HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-vers-keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
---
# Le solveur ACME de cert-manager, joint par Traefik pendant le défi HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defi-acme
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8089
