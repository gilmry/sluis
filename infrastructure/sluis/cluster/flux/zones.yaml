spec:
  dependsOn:
    - name: configuration
    - name: operateur-keycloak-plateforme
  interval: 1h
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: sluis
  path: ./infrastructure/sluis/cluster/zone-2
  prune: false
  wait: true
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: parametres-plateforme
