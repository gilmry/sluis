apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controleurs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: sluis
  path: ./infrastructure/sluis/cluster/commun/controleurs
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configuration
  namespace: flux-system
spec:
  dependsOn:
    - name: controleurs
  interval: 1h
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: sluis
  path: ./infrastructure/sluis/cluster/commun/configuration
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: parametres-plateforme
