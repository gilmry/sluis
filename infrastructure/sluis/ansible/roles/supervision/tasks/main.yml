- name: Exiger le point d'écriture et ses identifiants
  ansible.builtin.assert:
    that:
      - supervision_ecriture is match('^https://')
      - supervision_identifiant is defined
      - supervision_mot_de_passe is defined
    fail_msg: "Supervision : point d'écriture HTTPS dans l'inventaire, identifiants dans le fichier SOPS."

- name: Répertoire des clés de dépôts
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Clé du dépôt de Grafana
  ansible.builtin.get_url:
    url: "{{ supervision_depot_cle }}"
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"

- name: Lire l'empreinte de la clé téléchargée
  ansible.builtin.command: gpg --show-keys --with-colons /etc/apt/keyrings/grafana.asc
  register: supervision_cle
  changed_when: false
  check_mode: false

- name: Exiger la clé attendue
  ansible.builtin.assert:
    that: supervision_cle.stdout is search('fpr:::::::::' ~ supervision_depot_empreinte ~ ':')
    fail_msg: "La clé du dépôt de Grafana n'a pas l'empreinte attendue : ne rien installer."

- name: Dépôt de Grafana, signé par cette seule clé
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.sources
    content: |
      Types: deb
      URIs: https://apt.grafana.com
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: "0644"
  register: supervision_depot

- name: Installer Alloy, version épinglée
  ansible.builtin.apt:
    name: "alloy={{ supervision_alloy_version }}*"
    state: present
    update_cache: "{{ supervision_depot.changed }}"
  notify: Redémarrer alloy

- name: Retenir la version d'Alloy
  ansible.builtin.dpkg_selections:
    name: alloy
    selection: hold

- name: Répertoire des métriques locales
  ansible.builtin.file:
    path: "{{ supervision_metriques_locales }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configuration d'Alloy
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: Redémarrer alloy

- name: Identifiants d'Alloy
  ansible.builtin.template:
    src: alloy.env.j2
    dest: /etc/default/alloy
    owner: root
    group: alloy
    mode: "0640"
  no_log: true
  notify: Redémarrer alloy

- name: Démarrer Alloy
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
