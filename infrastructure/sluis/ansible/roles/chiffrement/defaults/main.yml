# Volume chiffré qui porte tout ce que la machine sait : données de Docker
# (images, volumes de Sluis, journal d'audit, dépôt OAuth), certificats TLS,
# dépôt de déploiement et son .env. Le système lui-même reste en clair.
#
# Un fichier LUKS2 sur le disque du VPS, et non le disque entier : un VPS
# OVHcloud se livre sur une image non chiffrée, et chiffrer sa racine exige le
# mode secours et un déverrouillage dans l'initramfs (point ouvert d'ADR-032).
chiffrement_fichier: /srv/chiffre.luks
chiffrement_nom: sluis_chiffre
chiffrement_point: /srv/chiffre
