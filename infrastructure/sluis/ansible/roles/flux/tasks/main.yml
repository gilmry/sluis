- name: Exiger les clés des signataires
  ansible.builtin.assert:
    that:
      - flux_cles_verification | length > 0
      - lookup('ansible.builtin.file', flux_cles_verification) is search('^(sk-)?ssh-ed25519 ', multiline=True)
    fail_msg: >-
      flux_cles_verification ne désigne aucune clé ed25519. Sans signataire,
      Flux appliquerait n'importe quel commit du dépôt public.

- name: Répertoire des manifestes posés
  ansible.builtin.file:
    path: /var/lib/sluis
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Manifeste d'installation de Flux, vérifié par son empreinte
  ansible.builtin.get_url:
    url: "{{ flux_install_url }}"
    dest: "{{ flux_manifeste }}"
    checksum: "sha256:{{ flux_install_sha256 }}"
    owner: root
    group: root
    mode: "0600"
  register: flux_telechargement

- name: Flux est-il déjà installé
  ansible.builtin.command: kubectl -n flux-system get deployment source-controller -o name
  register: flux_present
  changed_when: false
  failed_when: false
  check_mode: false

# L'application côté serveur se dit toujours « appliquée » : on ne la relance
# que pour une version nouvelle ou une installation absente, pour que le
# second passage reste à changed=0.
- name: Installer les contrôleurs de Flux
  ansible.builtin.command: kubectl apply --server-side --force-conflicts -f {{ flux_manifeste }}
  when: flux_telechargement.changed or flux_present.rc != 0
  changed_when: true

- name: Attendre les contrôleurs de Flux
  ansible.builtin.command: kubectl -n flux-system wait --for=condition=Available deployment --all --timeout=300s
  changed_when: false
  check_mode: false

- name: Clés des signataires admis
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl -n flux-system create secret generic signataires \
        --from-literal=signataires.sshpub="$SIGNATAIRES" \
        --dry-run=client -o yaml | kubectl apply -f -
    executable: /bin/bash
  environment:
    SIGNATAIRES: "{{ lookup('ansible.builtin.file', flux_cles_verification) }}"
  register: flux_signataires
  changed_when: flux_signataires.stdout is search('(created|configured)')

- name: Source et racine de Flux
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.template', 'racine.yaml.j2') }}"
  register: flux_racine
  changed_when: flux_racine.stdout is search('(created|configured)')
