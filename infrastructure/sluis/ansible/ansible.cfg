# Lancé par ../deployer.sh, depuis le poste du superviseur. L'inventaire,
# known_hosts et les secrets vivent hors du dépôt ; deployer.sh les désigne.
[defaults]
roles_path = ./roles
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = False
# Jamais de secret dans une sortie : les tâches qui en manipulent portent
# no_log, et l'écart affiché par --diff est coupé pour elles aussi.
display_skipped_hosts = False
interpreter_python = /usr/bin/python3

[ssh_connection]
pipelining = True
